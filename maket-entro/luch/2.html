<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Луч · вариант 2 — Прожектор</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
/* Объёмный луч проходит по экрану и «проявляет» логотип, в луче летит пыль */
.beam{position:absolute;top:-20%;left:0;width:34vw;min-width:220px;height:140%;transform:translateX(-60vw) skewX(-14deg);
  background:linear-gradient(90deg,transparent,rgba(170,230,245,.10) 18%,rgba(200,242,252,.45) 42%,rgba(240,252,255,.75) 50%,rgba(200,242,252,.45) 58%,rgba(170,230,245,.10) 82%,transparent);
  animation:sweep 3s .2s cubic-bezier(.4,.1,.6,.9) forwards}
@keyframes sweep{0%{transform:translateX(-60vw) skewX(-14deg)}100%{transform:translateX(120vw) skewX(-14deg)}}
/* после прохода — мягкий верхний свет над логотипом */
.top{position:absolute;left:50%;top:-10%;width:60vmin;height:70vh;transform:translateX(-50%);
  background:conic-gradient(from 180deg at 50% 0%,transparent 160deg,rgba(190,240,250,.26) 174deg,rgba(220,248,255,.38) 180deg,rgba(190,240,250,.26) 186deg,transparent 200deg);
  opacity:0;animation:fadein 1.6s 2.6s ease forwards}
/* логотип проявляется вслед за лучом (маска едет слева направо) */
.logo{-webkit-mask:linear-gradient(90deg,#000 40%,transparent 60%) 100% 0/250% 100% no-repeat;mask:linear-gradient(90deg,#000 40%,transparent 60%) 100% 0/250% 100% no-repeat;
  animation:reveal 1.1s 1.1s linear forwards;filter:drop-shadow(0 0 18px rgba(170,230,245,.35))}
@keyframes reveal{to{-webkit-mask-position:0 0;mask-position:0 0}}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sub{animation:fadein 1s 2.9s ease forwards}
@keyframes fadein{to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important}}
</style></head><body>
<div class="cap">Вариант 2 · Прожектор</div>
<div class="stage">
  <div class="top"></div>
  <canvas id="dust"></canvas>
  <div class="beam" id="beam"></div>
  <img class="logo" src="../assets/logo-white.png" alt="ENTRO">
  <div class="sub">межкомнатные двери</div>
</div>
<script>
// пылинки светятся, только когда в них попадает луч или верхний свет
const c=document.getElementById('dust'),x=c.getContext('2d'),beam=document.getElementById('beam');
let W,H,P=[];const t0=performance.now();
function size(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio}
size();addEventListener('resize',size);
for(let i=0;i<140;i++)P.push({x:Math.random(),y:Math.random(),r:Math.random()*1.6+.4,vx:(Math.random()-.5)*.00008,vy:-Math.random()*.00012-.00002});
function tick(now){
  x.clearRect(0,0,W,H);
  const b=beam.getBoundingClientRect(),bc=(b.left+b.width/2)/innerWidth,bw=b.width/innerWidth/2;
  const settled=Math.min(1,Math.max(0,(now-t0-2600)/1600));
  for(const p of P){
    p.x+=p.vx*16;p.y+=p.vy*16;if(p.y<0){p.y=1;p.x=Math.random()}
    const inBeam=Math.max(0,1-Math.abs(p.x+(p.y-.5)*.25-bc)/bw);
    const inTop=settled*Math.max(0,1-Math.abs(p.x-.5)/(.12+.18*p.y))*(1-p.y*.6);
    const a=Math.min(1,inBeam*.9+inTop*.6);
    if(a<.02)continue;
    x.fillStyle=`rgba(220,248,255,${a})`;x.beginPath();x.arc(p.x*W,p.y*H,p.r*devicePixelRatio,0,7);x.fill();
  }
  requestAnimationFrame(tick);
}
if(!location.search.includes('nodust'))requestAnimationFrame(tick);
</script>
<script src="bar.js"></script>
</body></html>
