<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Луч · вариант 1 — Дверь из света</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
/* Луч раскрывается в светящийся дверной проём, из него выходит логотип */
.door{position:absolute;left:50%;top:50%;width:2px;height:62vh;transform:translate(-50%,-50%) scaleY(0);transform-origin:center;
  background:linear-gradient(180deg,rgba(220,250,255,.95),rgba(170,230,245,.85));
  box-shadow:0 0 30px 8px rgba(160,225,240,.45),0 0 120px 40px rgba(120,200,220,.18);
  animation:grow .9s .2s cubic-bezier(.5,0,.2,1) forwards, open 1.1s 1.1s cubic-bezier(.6,0,.2,1) forwards, dim 1.2s 2.2s ease forwards}
@keyframes grow{to{transform:translate(-50%,-50%) scaleY(1)}}
@keyframes open{from{width:2px}to{width:min(230px,42vw)}}
@keyframes dim{to{opacity:.16;filter:blur(2px)}}
/* световая дорожка на полу */
.floor{position:absolute;left:50%;top:calc(50% + 31vh);width:min(230px,42vw);height:30vh;transform:translateX(-50%);
  clip-path:polygon(0 0,100% 0,180% 100%,-80% 100%);background:linear-gradient(180deg,rgba(170,230,245,.35),transparent 80%);
  opacity:0;animation:fadein 1s 1.5s ease forwards, dimf 1.2s 2.2s ease forwards}
@keyframes dimf{to{opacity:.12}}
/* лёгкая дымка-сияние за проёмом */
.haze{position:absolute;left:50%;top:50%;width:90vmax;height:90vmax;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(150,215,230,.22),transparent 55%);opacity:0;animation:fadein 1.4s 1.2s ease forwards}
.logo{opacity:0;filter:blur(10px);animation:logo 1.2s 1.9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes logo{from{opacity:0;filter:blur(10px);transform:translate(-50%,-46%) scale(.96)}to{opacity:1;filter:blur(0);transform:translate(-50%,-50%) scale(1)}}
.sub{animation:fadein 1s 2.7s ease forwards}
@keyframes fadein{to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important}}
</style></head><body>
<div class="cap">Вариант 1 · Дверь из света</div>
<div class="stage">
  <div class="haze"></div>
  <div class="floor"></div>
  <div class="door"></div>
  <img class="logo" src="../assets/logo-white.png" alt="ENTRO">
  <div class="sub">межкомнатные двери</div>
</div>
<script src="bar.js"></script>
</body></html>
